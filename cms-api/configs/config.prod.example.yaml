# 生产环境模板默认使用 SQLite 单实例部署；多实例或高写入场景可切换为 PostgreSQL。
# 实际 configs/config.prod.yaml 以只读文件或挂载方式由部署系统提供，不提交 Git。
# 所有占位符值必须在部署时替换为真实值。
swagger:
  enabled: false

database:
  driver: sqlite
  url: /data/cms/cms.db
  username: ""
  password: ""

# PostgreSQL profile for multi-instance or higher-write deployments:
# database:
#   driver: postgres
#   url: postgres://db.example.internal:5432/cms_api?sslmode=require
#   username: set-in-deployment-config
#   password: set-in-deployment-config

jwt:
  secret: change-me

file:
  storage_root: /data/cms/uploads

auth:
  login_guard:
    ip_max_attempts: 20
    username_max_attempts: 5

log:
  level: info
  format: json
