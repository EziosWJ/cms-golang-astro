services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms_api}
      POSTGRES_USER: ${POSTGRES_USER:-cms_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - cms_api_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: ..
      dockerfile: cms-api/Dockerfile
      target: migrate
    environment:
      APP_ENV: dev
      APP_DATABASE__DRIVER: postgres
      APP_DATABASE__URL: postgres://postgres:5432/${POSTGRES_DB:-cms_api}?sslmode=disable
      APP_DATABASE__USERNAME: ${POSTGRES_USER:-cms_api}
      APP_DATABASE__PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT__SECRET: ${APP_JWT__SECRET:?set APP_JWT__SECRET in .env}
      APP_LOG__LEVEL: debug
      APP_LOG__FORMAT: text
    depends_on:
      postgres:
        condition: service_healthy
    command: ["up", "--kind", "all"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: cms-api/Dockerfile
      target: api
    environment:
      APP_ENV: dev
      APP_DATABASE__DRIVER: postgres
      APP_DATABASE__URL: postgres://postgres:5432/${POSTGRES_DB:-cms_api}?sslmode=disable
      APP_DATABASE__USERNAME: ${POSTGRES_USER:-cms_api}
      APP_DATABASE__PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT__SECRET: ${APP_JWT__SECRET:?set APP_JWT__SECRET in .env}
      APP_SWAGGER__ENABLED: "true"
      APP_HTTP__ADDRESS: ":8080"
      APP_LOG__LEVEL: debug
      APP_LOG__FORMAT: text
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - cms_api_uploads:/data/cms/uploads
    restart: unless-stopped

volumes:
  cms_api_postgres_data:
    name: cms_api_postgres_data
  cms_api_uploads:
    name: cms_api_uploads
