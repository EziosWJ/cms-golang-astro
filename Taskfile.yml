# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

env:
  APP_ENV: dev
  GOCACHE: '{{.ROOT_DIR}}/.task/go-build'

tasks:
  default:
    desc: 显示可用任务
    cmds:
      - task --list
    silent: true

  db:migrate:
    desc: 使用当前数据库配置执行迁移
    dir: cms-api
    env:
      APP_FILE__STORAGE_ROOT: '{{.ROOT_DIR}}/.runtime/uploads'
    cmds:
      - go run ./cmd/migrate up --kind all

  db:migrate:sqlite:
    desc: 对 SQLite 数据库执行迁移
    dir: cms-api
    env:
      APP_CONFIG_PROFILE: sqlite
      APP_DATABASE__URL: '{{.ROOT_DIR}}/.runtime/cms.db'
      APP_FILE__STORAGE_ROOT: '{{.ROOT_DIR}}/.runtime/uploads'
    cmds:
      - go run ./cmd/migrate up --kind all

  api:sqlite:
    desc: 使用 SQLite 配置启动 API
    dir: cms-api
    env:
      APP_CONFIG_PROFILE: sqlite
      APP_DATABASE__URL: '{{.ROOT_DIR}}/.runtime/cms.db'
      APP_FILE__STORAGE_ROOT: '{{.ROOT_DIR}}/.runtime/uploads'
    cmds:
      - go run ./cmd/api

  api:
    desc: 使用当前数据库配置启动 API
    dir: cms-api
    env:
      APP_FILE__STORAGE_ROOT: '{{.ROOT_DIR}}/.runtime/uploads'
    cmds:
      - go run ./cmd/api

  admin:
    desc: 启动 CMS Admin 开发服务器
    dir: cms-admin
    cmds:
      - npm run dev -- --host 0.0.0.0

  site:
    desc: 启动 Astro 开发服务器
    dir: site
    cmds:
      - npm run dev -- --host 0.0.0.0

  dev:
    desc: 启动 SQLite API、CMS Admin、发布执行器、正式站点和 Astro 开发服务器
    deps:
      - db:migrate:sqlite
    cmds:
      - task --parallel api:sqlite admin site:serve site

  dev:cms:
    desc: 启动 SQLite API 和 CMS Admin
    deps:
      - db:migrate:sqlite
    cmds:
      - task --parallel api:sqlite admin

  dev:site:
    desc: 仅启动 Astro 站点
    cmds:
      - task site

  backend:check:
    desc: 运行 Go 测试和静态分析
    dir: cms-api
    cmds:
      - go test ./...
      - go vet ./...

  backend:test:
    desc: 运行 Go 测试
    dir: cms-api
    cmds:
      - go test ./...

  backend:vet:
    desc: 仅运行 Go 静态分析
    dir: cms-api
    cmds:
      - go vet ./...

  db:backup:
    desc: 创建 SQLite 在线备份；通过 CLI_ARGS 传递命令行参数
    dir: cms-api
    env:
      APP_CONFIG_PROFILE: sqlite
      APP_DATABASE__URL: '{{.ROOT_DIR}}/.runtime/cms.db'
      APP_FILE__STORAGE_ROOT: '{{.ROOT_DIR}}/.runtime/uploads'
    cmds:
      - go run ./cmd/backup {{.CLI_ARGS}}

  admin:lint:
    desc: 检查 CMS Admin 代码风格
    dir: cms-admin
    cmds:
      - npm run lint

  admin:test:
    desc: 运行 CMS Admin 脚本测试
    dir: cms-admin
    cmds:
      - node --test

  admin:date:check:
    desc: 检查内容日期及夏令时边界
    cmds:
      - node scripts/check-content-date.mjs

  admin:build:
    desc: 构建 CMS Admin
    dir: cms-admin
    cmds:
      - npm run build

  site:build:
    desc: 使用默认 Comic 主题构建 Astro 站点
    dir: site
    cmds:
      - npm run build

  site:build:vaporwave:
    desc: 使用 Vaporwave 主题构建 Astro 站点
    dir: site
    env:
      BLOG_THEME: vaporwave
    cmds:
      - npm run build

  site:themes:check:
    desc: 顺序验证所有内置 Astro 主题均可独立构建
    cmds:
      - task site:build
      - task site:build:vaporwave

  check:
    desc: 检查 Go、CMS Admin 和两套内置 Astro 主题
    deps:
      - backend:check
      - admin:lint
      - admin:test
      - admin:date:check
      - admin:build
      - site:themes:check

  build:cms:
    desc: 构建内嵌 CMS Admin 的 API 及迁移、备份等工具
    deps:
      - admin:build
    dir: cms-api
    vars:
      GOEXE:
        sh: go env GOEXE
    cmds:
      - node ../scripts/prepare-webui.mjs
      - go build -tags=embedweb -trimpath -o ../bin/cms-api{{.GOEXE}} ./cmd/api
      - go build -trimpath -o ../bin/cms-migrate{{.GOEXE}} ./cmd/migrate
      - go build -trimpath -o ../bin/cms-backup{{.GOEXE}} ./cmd/backup
      - go build -trimpath -o ../bin/cms-worker{{.GOEXE}} ./cmd/worker
      - go build -trimpath -o ../bin/cms-staticweb{{.GOEXE}} ./cmd/staticweb
      - go build -trimpath -o ../bin/cms-maintain{{.GOEXE}} ./cmd/maintain
      - go build -trimpath -o ../bin/cms-import{{.GOEXE}} ./cmd/import

  build:check:
    desc: 构建发布二进制并验证内嵌前端资源
    deps:
      - build:cms
    dir: cms-api
    cmds:
      - go test -tags=embedweb ./...
      - go vet -tags=embedweb ./...

  build:site:
    desc: 独立构建 Astro 站点
    cmds:
      - task site:build

  build:
    desc: 构建 CMS 二进制和 Astro 站点
    deps:
      - build:cms
      - build:site

  db:integration:sqlite:
    desc: 运行 SQLite 数据库集成验证
    dir: cms-api
    cmds:
      - go test -tags=integration ./integration -run SQLite -count=1

  db:integration:postgres:
    desc: 运行 PostgreSQL 数据库集成验证
    dir: cms-api
    cmds:
      - go test -tags=integration ./integration -run 'Postgres|Auth|RBAC|SysConfig|Department|Dictionary|Login|File|Notification|UserPage' -count=1

  worker:sqlite:
    desc: 启动 SQLite 发布执行器（请先显式执行迁移）
    dir: cms-api
    env:
      APP_CONFIG_PROFILE: sqlite
      APP_DATABASE__URL: '{{.ROOT_DIR}}/.runtime/cms.db'
      APP_FILE__STORAGE_ROOT: '{{.ROOT_DIR}}/.runtime/uploads'
      APP_PUBLICATION__RUNTIME_ROOT: '{{.ROOT_DIR}}/.runtime/publication'
      APP_PUBLICATION__SITE_ROOT: '{{.ROOT_DIR}}/site'
    cmds:
      - go run ./cmd/worker

  worker:
    desc: 使用当前数据库配置启动发布执行器
    dir: cms-api
    env:
      APP_FILE__STORAGE_ROOT: '{{.ROOT_DIR}}/.runtime/uploads'
      APP_PUBLICATION__RUNTIME_ROOT: '{{.ROOT_DIR}}/.runtime/publication'
      APP_PUBLICATION__SITE_ROOT: '{{.ROOT_DIR}}/site'
    cmds:
      - go run ./cmd/worker

  site:serve:
    desc: 独立提供已发布站点文件，不访问 CMS API 或数据库
    dir: cms-api
    cmds:
      - go run ./cmd/staticweb --root '{{.ROOT_DIR}}/.runtime/publication' --address ':8081'

  publication:cleanup:
    desc: 列出过期产物（先停止执行器；使用 -- --apply 才会删除）
    dir: cms-api
    env:
      APP_CONFIG_PROFILE: sqlite
      APP_DATABASE__URL: '{{.ROOT_DIR}}/.runtime/cms.db'
      APP_FILE__STORAGE_ROOT: '{{.ROOT_DIR}}/.runtime/uploads'
      APP_PUBLICATION__RUNTIME_ROOT: '{{.ROOT_DIR}}/.runtime/publication'
    cmds:
      - go run ./cmd/maintain {{.CLI_ARGS}}

  content:import:
    desc: 预检旧内容；必须传入 -- --source PATH --source-id ID --actor-id ID
    dir: cms-api
    env:
      APP_CONFIG_PROFILE: sqlite
      APP_DATABASE__URL: '{{.ROOT_DIR}}/.runtime/cms.db'
      APP_FILE__STORAGE_ROOT: '{{.ROOT_DIR}}/.runtime/uploads'
      APP_PUBLICATION__RUNTIME_ROOT: '{{.ROOT_DIR}}/.runtime/publication'
      APP_PUBLICATION__SITE_ROOT: '{{.ROOT_DIR}}/site'
    cmds:
      - go run ./cmd/import {{.CLI_ARGS}}

  content:legacy:check:
    desc: 在隔离数据库中验证只读旧内容来源
    dir: cms-api
    env:
      CMS_LEGACY_EVIDENCE_ROOT: '{{.ROOT_DIR}}/.runtime/phase-1/legacy-real'
    cmds:
      - go test -tags=integration ./integration -run TestSQLiteLegacyRealSource -count=1 -v

  admin:workflow:check:
    desc: 在预先准备的隔离环境中验证作者流程（需要 CMS_WORKFLOW_URL 与已安装浏览器路径）
    cmds:
      - node scripts/check-author-workflow.mjs
      - node scripts/check-author-boundaries.mjs
