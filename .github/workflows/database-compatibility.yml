name: Check and database compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Task check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cms-api/go.mod
          cache-dependency-path: cms-api/go.sum
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            cms-admin/package-lock.json
            site/package-lock.json
      - name: Set up Task
        uses: go-task/setup-task@v1
      - name: Install CMS Admin dependencies
        run: npm --prefix cms-admin ci
      - name: Install Astro dependencies
        run: npm --prefix site ci
      - name: Run checks
        run: task check
      - name: Verify embedded admin build
        run: task build:check

  sqlite-contract:
    name: SQLite migration and API contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cms-api/go.mod
          cache-dependency-path: cms-api/go.sum
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install Astro dependencies
        run: npm --prefix ../site ci
      - name: Check migration streams
        run: go test ./migrations
      - name: Run SQLite integration contract
        run: go test -tags=integration ./integration -run SQLite -count=1

  postgres-contract:
    name: PostgreSQL integration contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cms-api/go.mod
          cache-dependency-path: cms-api/go.sum
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install Astro dependencies
        run: npm --prefix ../site ci
      - name: Run PostgreSQL integration contract
        run: >-
          go test -tags=integration ./integration
          -run 'Postgres|Auth|RBAC|SysConfig|Department|Dictionary|Login|File|Notification|UserPage'
          -count=1
